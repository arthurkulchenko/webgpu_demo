[package]
name = "webgpu_demo"
version = "0.1.0"
edition = "2024"
description = ""
license = ""
repository = ""

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "webgpu"
path = "src/main.rs"

[dependencies]
pollster = "0.4"

# winit = "0.28"
# winit = { version = "0.30", features = ["web_platform"] }
winit = "0.30"
wgpu = "25.0.2"
console_error_panic_hook = "0.1"

env_logger = "0.11"
log = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3.18"
cfg-if = "1"
# the other regular dependencies...
getrandom = { version = "0.3", features = ["wasm_js"] }
# imp = "0.1.0"

# [build]
# rustflags = ["--cfg", 'getrandom_backend="wasm_js"']

# [package.metadata.wasm-pack]
# getrandom_backend="wasm_js"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
console_log = { version = "1.0", features = ["color"] }
# wgpu = { version = "^0.19.3", features = ["webgl", "webgpu", "default"]}
wgpu = { version = "25.0.0", features = ["webgl", "webgpu", "default"]}
# wgpu = { version = "0.20.0", features = ["webgl", "default"]}
tracing-wasm = "0.2.1"
# wasm-bindgen = "=0.2.92"
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
# web-sys = { version = "0.3.69", features = ["Document", "Window", "Element", "console", "HtmlCanvasElement", "HtmlCollection"] }
